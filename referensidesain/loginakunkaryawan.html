<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#faf8ff;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#93ccff", "tertiary-fixed": "#cce5ff", "on-tertiary": "#ffffff", "error-container": "#ffdad6", "surface-container-high": "#e2e7ff", "surface-container-low": "#f2f3ff", "on-tertiary-fixed-variant": "#004b73", "on-primary-fixed-variant": "#003ea8", "inverse-on-surface": "#eef0ff", "surface-variant": "#dae2fd", "on-primary-container": "#eeefff", "outline": "#737686", "on-primary": "#ffffff", "surface-dim": "#d2d9f4", "primary-fixed-dim": "#b4c5ff", "surface-container": "#eaedff", "on-primary-fixed": "#00174b", "on-secondary-container": "#00714d", "surface-bright": "#faf8ff", "secondary": "#006c49", "on-secondary-fixed-variant": "#005236", "on-surface": "#131b2e", "primary-container": "#2563eb", "secondary-container": "#6cf8bb", "primary-fixed": "dbe1ff", "surface-container-highest": "#dae2fd", "surface-container-lowest": "#ffffff", "primary": "#004ac6", "outline-variant": "#c3c6d7", "secondary-fixed-dim": "#4edea3", "on-secondary": "#ffffff", "surface-tint": "#0053db", "tertiary-container": "#0073ae", "tertiary": "#005a89", "on-background": "#131b2e", "error": "#ba1a1a", "background": "#faf8ff", "on-tertiary-fixed": "#001d31", "on-error-container": "#93000a", "on-tertiary-container": "#e7f2ff", "inverse-primary": "#b4c5ff", "on-secondary-fixed": "#002113", "on-surface-variant": "#434655", "inverse-surface": "#283044", "secondary-fixed": "#6ffbbe", "on-error": "#ffffff", "surface": "#faf8ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter-desktop": "1.5rem", "margin-desktop": "3rem", "space-xl": "2rem", "margin": "1rem", "margin-tablet": "2rem", "space-lg": "1.5rem", "space-md": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "gutter": "1rem" }, "fontFamily": { "display-sm": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "label-lg": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "headline-xl-mobile": ["Inter"], "headline-xl": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "display-sm": ["2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["1.125rem", { "lineHeight": "1.75rem", "fontWeight": "400" }], "body-md": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "400" }], "headline-sm": ["1.125rem", { "lineHeight": "1.5rem", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["0.875rem", { "lineHeight": "1.25rem", "fontWeight": "400" }], "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-lg": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-md": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-xl-mobile": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.015em", "fontWeight": "700" }], "headline-xl": ["2rem", { "lineHeight": "2.5rem", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["0.6875rem", { "lineHeight": "0.875rem", "letterSpacing": "0.025em", "fontWeight": "500" }], "display-lg": ["3.5rem", { "lineHeight": "4rem", "letterSpacing": "-0.03em", "fontWeight": "700" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Dynamic Top Ambient Aura -->
<div class="relative w-full flex flex-col items-center pt-space-lg">
<div class="absolute -top-12 w-64 h-64 bg-primary/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Brand Identity Block -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="relative w-16 h-16 rounded-xl bg-surface-container-lowest shadow-md flex items-center justify-center p-2 mb-space-md transition-transform active:scale-95 duration-200">
<img alt="NusaPresence Logo" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/ALJJyrCD6zE185OIMbswdrhT63iZD2ZJp2vEi8rRBuSs0-gKGDkIjt-_3BfCaDPGN_U7gECRZIY-3ue_daXt0dRYcuOlrawGI77G5KC6Rbqxsu0dB9MBOSNpqU6UQbE0K-lxRntSuy8sWvRHXUrHDazGfm0kndJrBg0ggvoem0wKKOeEOaWuuVqgWOsS0RrtNFEe4pi7Di2LE05P22RMdjpcKK3g8KDaEyksT8bf_dVWCYxv"/>
<div class="absolute -bottom-1 -right-1 w-4 h-4 bg-secondary rounded-full flex items-center justify-center shadow-sm">
<span class="w-1.5 h-1.5 bg-surface-container-lowest rounded-full animate-ping"></span>
</div>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">
        NusaPresence
      </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1">
        Sistem Presensi Digital & Manajemen Karyawan
      </p>
</div>
<!-- Login Surface Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-lg p-space-lg flex flex-col gap-space-md">
<!-- Input: Phone Number -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone-input">
          Nomor WhatsApp / HP
        </label>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="pl-3.5 pr-2.5 flex items-center gap-1.5 text-on-surface-variant select-none">
<span class="material-symbols-outlined text-[20px] text-primary">smartphone</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">+62</span>
</div>
<div class="w-px h-5 bg-outline-variant/50 mr-2"></div>
<input class="w-full py-3.5 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="phone-input" inputmode="numeric" placeholder="812-3456-7890" type="tel"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password-input">
          Kata Sandi
        </label>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all duration-200 focus-within:bg-surface-container-lowest focus-within:shadow-md">
<div class="pl-3.5 pr-2.5 flex items-center text-primary select-none">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full py-3.5 pr-11 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password-input" placeholder="••••••••" type="password"/>
<button aria-label="Lihat Kata Sandi" class="absolute right-3.5 text-on-surface-variant hover:text-primary flex items-center justify-center p-1 rounded-full transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Quick Toggles / Utility Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<div class="relative inline-flex items-center">
<input checked="" class="sr-only peer" id="remember-me" type="checkbox"/>
<div class="w-9 h-5 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-surface-container-lowest after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface-container-lowest after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary-container"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Ingat Saya</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:underline font-semibold" href="#lupa-sandi">
          Lupa Kata Sandi?
        </a>
</div>
<!-- Primary Action CTA -->
<button class="w-full mt-2 h-14 bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-150" id="login-btn" type="button">
<span>Masuk ke Aplikasi</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
<!-- Biometric Secondary Action -->
<div class="flex flex-col items-center pt-2">
<button class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-surface-container-low text-primary hover:bg-surface-container transition-all duration-150 active:scale-95 shadow-sm" id="biometric-btn" type="button">
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">face</span>
<span class="font-label-md text-label-md font-semibold">Masuk dengan Face ID / Biometrik</span>
</button>
</div>
</div>
<!-- Administrative HR Notice -->
<div class="w-full mt-space-lg p-space-md rounded-xl bg-surface-container-low flex items-start gap-3 text-left">
<div class="p-1 rounded-md bg-surface-container text-tertiary mt-0.5">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
        Akun didaftarkan oleh Administrator HR. Hubungi tim HRD jika mengalami kendala akses.
      </p>
</div>
<!-- Version & Security Footnote -->
<div class="mt-space-lg flex items-center justify-center gap-2 text-outline">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-label-sm text-label-sm font-medium tracking-wide">
        v2.4.0 (PWA) • Terenkripsi TLS 1.3
      </span>
</div>
</div>
</div>
<script>
  (function() {
    // Password visibility toggle interaction
    var toggleBtn = document.getElementById('toggle-password');
    var passwordInput = document.getElementById('password-input');
    var eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        var isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Biometric feedback microinteraction
    var biometricBtn = document.getElementById('biometric-btn');
    if (biometricBtn) {
      biometricBtn.addEventListener('click', function() {
        var origText = biometricBtn.querySelector('span:nth-child(2)');
        if (origText) {
          var current = origText.textContent;
          origText.textContent = 'Memindai Sensor...';
          setTimeout(function() {
            origText.textContent = current;
          }, 1800);
        }
      });
    }
  })();
</script></main></body></html>
